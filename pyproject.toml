[project]
name = "beancount-hypothesis"
version = "0.1.1"
description = "A package which provides hypothesis strategies for generating beancount types"
authors = [{ name = "Joshua Gilman", email = "joshuagilman@gmail.com" }]
readme = "README.md"
keywords = ["beancount", "hypothesis", "testing"]
dependencies = [
  "beancount>=2.3.6,<3",
  "hypothesis>=6.36.2",
  "RandomWords>=0.4.0",
]
requires-python = ">=3.10,<4.0"

[project.urls]
Homepage = "https://github.com/jmgilman/beancount-hypothesis"
Repository = "https://github.com/jmgilman/beancount-hypothesis"

[tool.ruff]
line-length = 79

[tool.rye]
managed = true
dev-dependencies = [
  "pytest>=8.2.2",
  "mypy>=1.11",
  "beancount-stubs>=0.1.3",
  "tox>=4.16",
  "twine>=5.1.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["beancount_hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
